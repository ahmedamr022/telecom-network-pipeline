apiVersion: 1

datasources:
  - name: PostgreSQL-Telecom
    type: postgres
    access: proxy
    uid: telecom_pg_ds
    url: postgres:5432
    user: telco_admin
    secureJsonData:
      password: telco_secure_pass
    jsonData:
      database: telecom_db
      sslmode: disable
      maxOpenConns: 20
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1500
      timescaledb: true
    isDefault: true
    editable: true
